<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>TiFtrace ✍️</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;overflow:hidden} body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(180deg,#f7fbff,#eef6ff);color:#13304b;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
    .topbar{text-align:center;padding:10px 12px 7px;flex-shrink:0} h1{font-size:clamp(1.4rem,5vw,2.2rem)} .subtitle{margin-top:3px;color:#4f6e8f;font-size:clamp(.82rem,2.8vw,1rem)}
    .hud{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding:0 10px 9px;flex-shrink:0}.pill{background:#fff;border:2px solid #d8ebff;border-radius:999px;padding:7px 12px;box-shadow:0 4px 14px #2e6fb614;font-weight:700;font-size:.9rem}.pill strong{color:#ff8a3d}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center}
    button,select{border:0;border-radius:999px;padding:9px 13px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 8px 18px #0000001f}button{color:#fff}.reset-btn{background:linear-gradient(135deg,#6ba9ff,#4f86f7)}.show-btn{background:linear-gradient(135deg,#ffb14a,#ff8a3d)}.words-btn{background:linear-gradient(135deg,#a66bff,#7547d8)}select{background:#fff;color:#315474;border:2px solid #d8ebff;max-width:145px}
    .stage-wrap{flex:1;min-height:0;padding:0 12px 12px}.stage{position:relative;width:100%;height:100%;background:#fff;border-radius:24px;border:4px solid #dff0ff;box-shadow:0 18px 50px #4f86f724;overflow:hidden;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.hint{position:absolute;top:12px;right:12px;background:#fffffff2;color:#40617f;border-radius:16px;padding:8px 12px;font-size:.82rem;box-shadow:0 8px 22px #0000001a;max-width:min(55vw,300px)}.guide-legend{position:absolute;left:12px;bottom:12px;background:#fffffff2;border-radius:16px;padding:9px 11px;font-size:.78rem;color:#496682;box-shadow:0 8px 22px #0000001a}.legend-row{display:flex;align-items:center;gap:8px;margin-top:5px}.legend-row:first-child{margin-top:0}.swatch{width:22px;height:8px;border-radius:999px}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#102c4c1f;pointer-events:none;opacity:0;transition:opacity .25s}.overlay.show{opacity:1}.card{background:#fff;border-radius:24px;padding:18px 20px;text-align:center;max-width:min(92vw,420px);box-shadow:0 18px 50px #00000024}.card h2{font-size:clamp(1.3rem,5vw,2rem);margin-bottom:8px}.card p{color:#53718d;line-height:1.45}@media(max-width:640px){.hud{gap:6px}.pill{font-size:.8rem;padding:6px 10px}button,select{padding:8px 10px;font-size:.82rem}.hint{max-width:62vw;font-size:.75rem}}
  </style>
</head>
<body>
  <div class="topbar"><h1>✍️ TiFtrace</h1><div class="subtitle">Tracează literele și cifrele, un segment pe rând.</div></div>
  <div class="hud">
    <div class="pill"><span id="modeLabel">Caracter</span> <strong id="targetLabel">A</strong></div>
    <div class="pill">Segment <strong id="segmentNow">1</strong> / <span id="segmentTotal">0</span></div>
    <div class="pill">Progres <strong id="progressPct">0%</strong></div>
    <div class="actions"><select id="glyphSelect" aria-label="Alege o literă sau cifră"></select><button class="words-btn" id="wordsBtn">📝 Cuvinte speciale</button><button class="show-btn" id="showBtn">👀 Arată modelul</button><button class="reset-btn" id="resetBtn">↺ Reia</button></div>
  </div>
  <div class="stage-wrap"><div class="stage" id="stage"><canvas id="guideCanvas"></canvas><canvas id="drawCanvas"></canvas><div class="hint" id="hint">Începe pe segmentul albastru gros.</div><div class="guide-legend"><div class="legend-row"><span class="swatch" style="background:#59bfff"></span> segment activ</div><div class="legend-row"><span class="swatch" style="background:#ff8a3d"></span> traseul tău</div></div><div class="overlay" id="overlay"><div class="card" id="overlayCard"></div></div></div></div>
  <script>
    const stage=document.getElementById('stage'), guideCanvas=document.getElementById('guideCanvas'), drawCanvas=document.getElementById('drawCanvas'), gctx=guideCanvas.getContext('2d'), dctx=drawCanvas.getContext('2d');
    const targetLabel=document.getElementById('targetLabel'), modeLabel=document.getElementById('modeLabel'), segmentNowEl=document.getElementById('segmentNow'), segmentTotalEl=document.getElementById('segmentTotal'), progressPctEl=document.getElementById('progressPct'), hintEl=document.getElementById('hint'), glyphSelect=document.getElementById('glyphSelect'), wordsBtn=document.getElementById('wordsBtn'), overlay=document.getElementById('overlay'), overlayCard=document.getElementById('overlayCard');
    const VIEW={width:1000,height:1000}, GUIDE='#59bfff', GLOW='#c9f0ff', DRAW='#ff8a3d', CHECK_RADIUS=30, ADVANCE=.72;
    const glyphs='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('');
    const S=(...points)=>points.map(p=>p.split(',').map(Number));
    const FONT={
      A:[S('180,850 500,150 820,850'),S('300,560 700,560')],B:[S('220,850 220,150'),S('220,150 610,150 760,250 610,500 220,500'),S('220,500 610,500 760,650 610,850 220,850')],C:[S('800,200 680,150 350,150 180,300 180,700 350,850 680,850 800,800')],D:[S('220,850 220,150'),S('220,150 600,150 800,300 800,700 600,850 220,850')],E:[S('760,150 220,150 220,850 760,850'),S('220,500 650,500')],F:[S('220,850 220,150 760,150'),S('220,500 650,500')],G:[S('800,250 680,150 350,150 180,300 180,700 350,850 700,850 800,750 800,600 540,600')],H:[S('220,150 220,850'),S('780,150 780,850'),S('220,500 780,500')],I:[S('220,150 780,150'),S('500,150 500,850'),S('220,850 780,850')],J:[S('220,150 780,150'),S('780,150 780,700 650,850 350,850 220,720')],K:[S('220,150 220,850'),S('780,150 220,500 780,850')],L:[S('220,150 220,850 780,850')],M:[S('180,850 180,150 500,520 820,150 820,850')],N:[S('200,850 200,150 800,850 800,150')],O:[S('350,150 650,150 800,300 800,700 650,850 350,850 200,700 200,300 350,150')],P:[S('220,850 220,150 620,150 780,280 620,500 220,500')],Q:[S('350,150 650,150 800,300 800,700 650,850 350,850 200,700 200,300 350,150'),S('570,650 820,900')],R:[S('220,850 220,150 620,150 780,280 620,500 220,500'),S('520,500 800,850')],S:[S('780,250 650,150 350,150 200,300 350,500 650,500 800,700 650,850 350,850 200,750')],T:[S('180,150 820,150'),S('500,150 500,850')],U:[S('200,150 200,700 350,850 650,850 800,700 800,150')],V:[S('180,150 500,850 820,150')],W:[S('140,150 300,850 500,500 700,850 860,150')],X:[S('200,150 800,850'),S('800,150 200,850')],Y:[S('180,150 500,500 820,150'),S('500,500 500,850')],Z:[S('180,150 820,150 180,850 820,850')],
      0:[S('350,150 650,150 800,300 800,700 650,850 350,850 200,700 200,300 350,150')],1:[S('350,300 500,150 500,850'),S('300,850 700,850')],2:[S('220,280 350,150 650,150 800,300 200,850 800,850')],3:[S('220,200 350,150 650,150 800,300 650,500 800,700 650,850 350,850 220,800'),S('650,500 400,500')],4:[S('680,850 680,150 200,600 800,600')],5:[S('780,150 250,150 200,500 650,500 800,650 650,850 350,850 200,750')],6:[S('760,180 600,150 350,220 200,400 200,700 350,850 650,850 800,700 650,520 200,520')],7:[S('180,150 820,150 420,850')],8:[S('350,150 650,150 800,300 650,500 350,500 200,300 350,150'),S('350,500 650,500 800,700 650,850 350,850 200,700 350,500')],9:[S('800,500 650,150 350,150 200,300 350,500 650,500 800,350 800,700 650,850')]
    };
    const WORDS=['ALX','MAMA','TATA']; let segments=[],currentIndex=0,completed=0,isDrawing=false,lastPoint=null,showModel=false,wordMode=false,wordIndex=0,wordCharIndex=0,currentGlyph='A'; const coverage=new Map();
    function fillSelector(){glyphs.forEach(ch=>{const o=document.createElement('option');o.value=ch;o.textContent=ch;glyphSelect.appendChild(o)})}
    function viewToCanvas(pt){const s=Math.min(stage.clientWidth/VIEW.width,stage.clientHeight/VIEW.height),ox=(stage.clientWidth-VIEW.width*s)/2,oy=(stage.clientHeight-VIEW.height*s)/2;return{x:pt[0]*s+ox,y:pt[1]*s+oy}}
    function clientToView(x,y){const r=stage.getBoundingClientRect(),s=Math.min(r.width/VIEW.width,r.height/VIEW.height),ox=(r.width-VIEW.width*s)/2,oy=(r.height-VIEW.height*s)/2,px=x-r.left,py=y-r.top;return{x:(px-ox)/s,y:(py-oy)/s,valid:px>=ox&&py>=oy&&px<=r.width-ox&&py<=r.height-oy}}
    function resize(){const r=stage.getBoundingClientRect();[guideCanvas,drawCanvas].forEach(c=>{c.width=Math.round(r.width*devicePixelRatio);c.height=Math.round(r.height*devicePixelRatio)});drawGuide();redraw()}
    function drawPolyline(ctx,seg,color,width,glow=false){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=color;ctx.lineWidth=width*devicePixelRatio;if(glow){ctx.shadowColor=color;ctx.shadowBlur=22*devicePixelRatio}ctx.beginPath();let p=viewToCanvas(seg.points[0]);ctx.moveTo(p.x*devicePixelRatio,p.y*devicePixelRatio);seg.points.slice(1).forEach(pt=>{p=viewToCanvas(pt);ctx.lineTo(p.x*devicePixelRatio,p.y*devicePixelRatio)});ctx.stroke();ctx.restore()}
    function drawGuide(){gctx.clearRect(0,0,guideCanvas.width,guideCanvas.height);segments.forEach((s,i)=>drawPolyline(gctx,s,i===currentIndex?GUIDE:i<currentIndex?'#d9eefc':'#bfe5fb',i===currentIndex?25:9,i===currentIndex))}
    function redraw(){dctx.clearRect(0,0,drawCanvas.width,drawCanvas.height);segments.forEach(s=>{if(!s.drawn||s.drawn.length<2)return;dctx.save();dctx.strokeStyle=DRAW;dctx.lineWidth=16*devicePixelRatio;dctx.lineCap='round';dctx.lineJoin='round';dctx.beginPath();let p=viewToCanvas(s.drawn[0]);dctx.moveTo(p.x*devicePixelRatio,p.y*devicePixelRatio);s.drawn.slice(1).forEach(pt=>{p=viewToCanvas(pt);dctx.lineTo(p.x*devicePixelRatio,p.y*devicePixelRatio)});dctx.stroke();dctx.restore()})}
    function sample(seg){const out=[];for(let i=1;i<seg.points.length;i++){const a=seg.points[i-1],b=seg.points[i],n=Math.max(2,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/12));for(let j=0;j<=n;j++){const t=j/n;out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}}return out}
    function updateHUD(){const total=segments.length||1;targetLabel.textContent=wordMode?WORDS[wordIndex]:currentGlyph;modeLabel.textContent=wordMode?`Cuvânt ${wordIndex+1}/${WORDS.length}`:'Caracter';segmentNowEl.textContent=Math.min(currentIndex+1,total);segmentTotalEl.textContent=total;progressPctEl.textContent=`${Math.round(completed/total*100)}%`;hintEl.textContent=currentIndex<total?(coverage.get(currentIndex)||0)>.45?'Foarte bine. Continuă segmentul.':'Începe pe segmentul albastru gros.':wordMode?'Cuvânt complet!':'Caracter complet!';wordsBtn.textContent=wordMode?`📝 Cuvânt: ${WORDS[wordIndex]}`:'📝 Cuvinte speciale'}
    function makeSegments(ch){return (FONT[ch]||FONT.A).map(points=>({points,drawn:[],samples:sample({points}),hit:[]}))}
    function startTarget(){const ch=wordMode?WORDS[wordIndex][wordCharIndex]:currentGlyph;segments=makeSegments(ch);currentIndex=0;completed=0;coverage.clear();segments.forEach(s=>s.hit=new Array(s.samples.length).fill(false));overlay.classList.remove('show');drawGuide();redraw();updateHUD()}
    function finishSegment(){completed++;currentIndex++;if(currentIndex<segments.length){drawGuide();updateHUD();return}if(wordMode&&wordCharIndex<WORDS[wordIndex].length-1){wordCharIndex++;startTarget();return}if(wordMode&&wordIndex<WORDS.length-1){wordIndex++;wordCharIndex=0;startTarget();return}drawGuide();updateHUD();overlay.classList.add('show');overlayCard.innerHTML=`<h2>🎉 Bravo!</h2><p>Ai terminat ${wordMode?`cuvintele ALX, MAMA și TATA`:`caracterul ${currentGlyph}`}.</p>`}
    function stamp(point){const s=segments[currentIndex];if(!s)return;let hits=0;s.samples.forEach((q,i)=>{if(!s.hit[i]&&Math.hypot(q[0]-point[0],q[1]-point[1])<=CHECK_RADIUS){s.hit[i]=true;hits++}});if(hits){const f=s.hit.filter(Boolean).length/s.hit.length;coverage.set(currentIndex,f);if(f>=ADVANCE)finishSegment()}}
    function stampLine(a,b){const targetIndex=currentIndex,n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/8));for(let i=0;i<=n&&currentIndex===targetIndex;i++){const t=i/n;stamp([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}}
    function begin(e){if(currentIndex>=segments.length)return;const p=clientToView(e.clientX,e.clientY);if(!p.valid)return;stage.setPointerCapture?.(e.pointerId);isDrawing=true;lastPoint=[p.x,p.y];segments[currentIndex].drawn.push(lastPoint);stamp(lastPoint);redraw()}
    function move(e){if(!isDrawing||currentIndex>=segments.length)return;const p=clientToView(e.clientX,e.clientY);if(!p.valid)return;const q=[p.x,p.y],s=segments[currentIndex];s.drawn.push(q);stampLine(lastPoint,q);lastPoint=q;redraw();updateHUD()}
    function end(e){isDrawing=false;lastPoint=null;if(e?.pointerId!=null&&stage.hasPointerCapture?.(e.pointerId))stage.releasePointerCapture(e.pointerId)}
    function reset(){wordCharIndex=0;startTarget()}
    fillSelector();glyphSelect.value='A';stage.addEventListener('pointerdown',begin);stage.addEventListener('pointermove',move);window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);window.addEventListener('resize',resize);
    glyphSelect.addEventListener('change',e=>{wordMode=false;currentGlyph=e.target.value;reset()});document.getElementById('resetBtn').addEventListener('click',reset);document.getElementById('showBtn').addEventListener('click',()=>{showModel=!showModel;document.getElementById('showBtn').textContent=showModel?'🙈 Ascunde modelul':'👀 Arată modelul';guideCanvas.style.opacity=showModel?'.42':'1'});wordsBtn.addEventListener('click',()=>{wordMode=!wordMode;wordIndex=0;wordCharIndex=0;glyphSelect.disabled=wordMode;reset()});resize();startTarget();
  </script>
</body>
</html>
